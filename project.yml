name: DashCam
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DashCam:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: DashCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dashcam
        PRODUCT_NAME: DashCam
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: DashCam
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Saves dash cam clips you choose to the DashCam album."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connects to your dash cam over its Wi-Fi network."
        CODE_SIGN_STYLE: Automatic
